<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111111">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f6f6;
    color:#171717;
    line-height:1.5;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    max-width:100%;
    display:block;
}

/* =========================
   HEADER
========================= */

.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:13px;
}

.topbar strong{
    color:#ffd400;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
}

.nav{
    max-width:1250px;
    margin:auto;
    min-height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    font-size:25px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    color:#e00000;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:20px;
    margin-left:auto;
}

.nav-links a{
    font-size:14px;
    font-weight:700;
}

.nav-links a:hover{
    color:#e00000;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    position:relative;
    border:1px solid #ddd;
    background:#fff;
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.icon-btn:hover{
    background:#f3f3f3;
}

.cart-count{
    position:absolute;
    right:-4px;
    top:-5px;
    background:#e00000;
    color:#fff;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.mobile-menu{
    display:none;
}

/* =========================
   HERO
========================= */

.hero{
    background:
        radial-gradient(circle at 85% 20%,rgba(255,215,0,.18),transparent 30%),
        linear-gradient(135deg,#101010,#242424);
    color:#fff;
    padding:70px 20px;
}

.hero-inner{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1.2fr .8fr;
    align-items:center;
    gap:50px;
}

.hero-tag{
    display:inline-block;
    background:#ffd400;
    color:#111;
    padding:7px 13px;
    border-radius:30px;
    font-weight:800;
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(38px,6vw,72px);
    line-height:1;
    margin-bottom:20px;
}

.hero h1 span{
    color:#ffd400;
}

.hero p{
    color:#ddd;
    max-width:650px;
    font-size:18px;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
