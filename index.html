<head>

  <title>PM Traders</title>
  <style>
    * {
      box-sizing: border-box;
    }body {
  margin: 0;

}

p {

  font-size: 18px;

}

.status {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 20px;

  background: #16803c;
  font-weight: bold;
}

  </style>
</head><body>  <div class="box">
