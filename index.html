<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Online Store</title>
<meta name="description" content="PM Traders — smartphones, human hair, fashion, gadgets and accessories.">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
color:#111
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.topbar{
background:#111;
color:#fff;
text-align:center;
padding:10px;
font-size:12px;
font-weight:800
}

header{
background:#fff;
min-height:72px;
padding:12px 6%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:500
}

.logo{
display:flex;
align-items:center;
gap:10px;
color:#111;
text-decoration:none;
font-size:18px;
font-weight:900
}

.logoBox{
width:43px;
height:43px;
background:#111;
color:#fff;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center
}

nav{
display:flex;
gap:25px
}

nav a{
color:#333;
text-decoration:none;
font-weight:800;
font-size:14px
}

.cartButton{
background:#111;
color:#fff;
border:0;
border-radius:9px;
padding:11px 16px;
font-weight:800
}

.mobileMenuButton{
display:none;
background:#111;
color:#fff;
border:0;
border-radius:9px;
padding:10px 13px
}

/* HERO */

.hero{
background:#111;
color:#fff;
min-height:540px;
padding:70px 7%;
display:grid;
grid-template-columns:1.2fr .8fr;
align-items:center;
gap:40px
}

.hero small{
color:#aaa;
font-size:12px;
font-weight:900;
letter-spacing:2px
}

.hero h1{
margin:18px 0;
font-size:clamp(45px,7vw,82px);
line-height:.95;
letter-spacing:-4px
}

.hero h1 span{color:#aaa}

.hero p{
max-width:590px;
color:#ccc;
font-size:18px;
line-height:1.6
}

.heroButtons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px
}

.shopButton,
.outlineButton{
display:inline-block;
padding:14px 22px;
border-radius:9px;
text-decoration:none;
font-weight:900
}

.shopButton{
background:#fff;
color:#111
}

.outlineButton{
border:1px solid #555;
color:#fff
}

.heroVisual{
display:flex;
justify-content:center;
align-items:center
}

.pmCircle{
width:270px;
height:270px;
border-radius:50%;
background:#fff;
color:#111;
display:flex;
align-items:center;
justify-content:center;
font-size:80px;
font-weight:900
}

/* TRUST */

.trust{
background:#fff;
display:grid;
grid-template-columns:repeat(4,1fr);
padding:22px 6%;
border-bottom:1px solid #ddd
}

.trustBox{
text-align:center;
padding:10px;
border-right:1px solid #eee
}

.trustBox:last-child{border:0}

.trustBox strong{
display:block;
margin-bottom:5px
}

.trustBox span{
font-size:13px;
color:#777
}

/* CATEGORIES */

.categories{
background:#fff;
padding:60px 6%
}

.sectionTitle{
text-align:center;
margin-bottom:35px
}

.sectionTitle small{
color:#777;
font-size:11px;
font-weight:900;
letter-spacing:2px
}

.sectionTitle h2{
margin:8px 0;
font-size:42px;
letter-spacing:-2px
}

.sectionTitle p{color:#777}

.categoryGrid{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.category{
border:1px solid #ddd;
background:#fafafa;
border-radius:15px;
padding:25px 15px;
text-align:center;
font-weight:900;
transition:.2s
}

.category:hover{
background:#111;
color:#fff;
transform:translateY(-3px)
}

.categoryIcon{
display:block;
font-size:32px;
margin-bottom:10px
}

/* SHOP */

.shop{
max-width:1500px;
margin:auto;
padding:75px 5%
}

.filters{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:35px
}

.filters input,
.filters select{
height:48px;
padding:0 15px;
background:#fff;
border:1px solid #ddd;
border-radius:9px;
outline:none
}

.filters input{width:320px}

/* PRODUCTS */

#productGrid{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:22px
}

.productCard{
background:#fff;
border:1px solid #ddd;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.06);
transition:.2s
}

.productCard:hover{
transform:translateY(-5px);
box-shadow:0 15px 35px rgba(0,0,0,.12)
}

.productImage{
height:290px;
background:#fafafa;
padding:12px;
display:flex;
align-items:center;
justify-content:center
}

.productImage img{
width:100%;
height:100%;
object-fit:contain
}

.productImage .placeholder{
font-size:65px;
font-weight:900;
color:#ddd
}

.productBody{padding:18px}

.tag{
display:inline-block;
background:#eee;
padding:5px 9px;
border-radius:20px;
font-size:9px;
font-weight:900
}

.productBody h3{
min-height:42px;
font-size:16px;
margin:12px 0
}

.price{
font-size:21px;
font-weight:900;
margin:10px 0
}

.productButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px
}

.addButton,
.viewButton{
border:0;
border-radius:8px;
padding:12px 7px;
font-size:12px;
font-weight:900
}

.addButton{
background:#111;
color:#fff
}

.viewButton{
background:#eee;
color:#111
}

/* GALLERY */

.galleryMain{
width:100%;
height:330px;
background:#fafafa;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.galleryMain img{
width:100%;
height:100%;
object-fit:contain
}

.galleryThumbs{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:12px;
padding-bottom:5px
}

.galleryThumb{
width:70px;
height:70px;
min-width:70px;
border:2px solid #ddd;
border-radius:8px;
background:#fafafa;
padding:3px
}

.galleryThumb.active{
border-color:#111
}

.galleryThumb img{
width:100%;
height:100%;
object-fit:contain
}

.galleryControls{
display:flex;
gap:8px;
margin-top:10px
}

.galleryControls button{
flex:1;
border:0;
background:#111;
color:#fff;
padding:10px;
border-radius:8px;
font-weight:800
}

/* PROMO */

.promo{
margin:0 5% 70px;
padding:40px;
background:#111;
color:#fff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}

.promo h2{margin:0 0 8px}

.promo p{
color:#bbb;
margin:0
}

.promo a{
background:#fff;
color:#111;
padding:13px 20px;
border-radius:8px;
text-decoration:none;
font-weight:900;
white-space:nowrap
}

/* DELIVERY */

.delivery{
background:#111;
color:#fff;
padding:75px 7%
}

.delivery h2{
font-size:45px;
letter-spacing:-2px;
max-width:700px
}

.deliveryGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.deliveryBox{
background:#181818;
border:1px solid #333;
border-radius:12px;
padding:25px;
color:#ccc
}

.deliveryBox strong{
display:block;
color:#fff;
margin-bottom:8px
}

/* WHY */

.why{
background:#fff;
padding:75px 7%
}

.whyGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.whyBox{
border:1px solid #ddd;
border-radius:15px;
padding:30px
}

.whyBox span{font-size:32px}

.whyBox p{
color:#777;
line-height:1.6
}

/* CONTACT */

.contact{
text-align:center;
padding:75px 7%;
background:#f5f5f5
}

.whatsapp{
display:inline-block;
background:#111;
color:#fff;
padding:14px 22px;
border-radius:9px;
text-decoration:none;
font-weight:900
}

/* FOOTER */

footer{
background:#080808;
color:#aaa;
