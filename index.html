<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PM Traders | Online Store</title>

<meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion and accessories. Nationwide delivery across South Africa.">
<meta name="theme-color" content="#111111">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#151515;
    line-height:1.5
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

:root{
    --black:#111;
    --gold:#f5c542;
    --gold-dark:#c49a20;
    --white:#fff;
    --muted:#777;
    --border:#e6e6e6;
    --green:#25d366;
    --red:#d62828;
    --cream:#fff8df
}

/* ================= TOP ================= */

.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:12px
}

.topbar strong{color:var(--gold)}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid var(--border)
}

.nav{
    max-width:1250px;
    min-height:72px;
    margin:auto;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:900
}

.logo-mark{
    width:43px;
    height:43px;
    background:#111;
    color:var(--gold);
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center
}

.logo span{color:var(--gold-dark)}

.navlinks{
    display:flex;
    align-items:center;
    gap:24px
}

.navlinks a{
    font-size:13px;
    font-weight:800
}

.navlinks a:hover{color:var(--gold-dark)}

.actions{
    display:flex;
    gap:8px
}

.icon-btn{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative
}

.cart-count{
    position:absolute;
    right:-5px;
    top:-5px;
    background:var(--red);
    color:#fff;
    min-width:20px;
    height:20px;
    border-radius:20px;
    font-size:10px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center
}

.mobile-menu{
    display:none;
    border-top:1px solid #eee
}

.mobile-menu a{
    display:block;
    padding:14px 18px;
    border-bottom:1px solid #eee;
    font-size:14px;
    font-weight:700
}

/* ================= HERO ================= */

.hero{
    color:#fff;
    background:
        radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 30%),
        linear-gradient(120deg,#111,#292929)
}

.hero-inner{
    max-width:1250px;
    min-height:500px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:40px;
    align-items:center
}

.badge{
    display:inline-block;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.05);
    font-size:12px;
    margin-bottom:18px
}

.hero h1{
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px
}

.hero h1 span{color:var(--gold)}

.hero p{
    max-width:600px;
    color:#d5d5d5;
    font-size:17px;
    margin-bottom:28px
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-weight:800;
    transition:.2s
}

.btn:hover{transform:translateY(-2px)}

.btn-gold{
    background:var(--gold);
    color:#111
}

.btn-white{
    background:#fff;
    color:#111
}

.btn-black{
    background:#111;
    color:#fff
}

.btn-green{
    background:var(--green);
    color:#fff
}

.hero-show{
    position:relative;
    min-height:350px;
    display:flex;
    align-items:center;
    justify-content:center
}

.hero-phone{
    width:235px;
    height:320px;
    overflow:hidden;
    border:6px solid #333;
    border-radius:28px;
    background:#222;
    transform:rotate(5deg);
    box-shadow:0 30px 70px rgba(0,0,0,.45)
}

.hero-phone img{
    width:100%;
    height:100%;
    object-fit:cover
}

.hero-hair{
    position:absolute;
    left:2%;
    bottom:5px;
    width:155px;
    height:195px;
    overflow:hidden;
    border:5px solid #fff;
    border-radius:18px;
    transform:rotate(-8deg);
    box-shadow:0 20px 50px rgba(0,0,0,.4)
}

.hero-hair img{
    width:100%;
    height:100%;
    object-fit:cover
}

/* ================= TRUST ================= */

.trust{
    background:#fff;
    border-bottom:1px solid var(--border)
}

.trust-inner{
    max-width:1250px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px
}

.trust-item{
    display:flex;
    align-items:center;
    gap:10px
}

.trust-icon{
    width:43px;
    height:43px;
    background:#fff7d8;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px
}

.trust-item strong{
    display:block;
    font-size:12px
}

.trust-item small{
    display:block;
    color:#777;
    font-size:10px
}

    max-width:1250px;
    margin:auto;
    padding:
