<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Online Store</title>

<meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion, gadgets and accessories. Nationwide delivery across South Africa.">
<meta name="theme-color" content="#111111">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#171717;
    line-height:1.5;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

:root{
    --black:#111;
    --black2:#202020;
    --gold:#f5c542;
    --gold2:#c49a20;
    --white:#fff;
    --muted:#777;
    --border:#e7e7e7;
    --green:#25d366;
    --red:#d62828;
    --cream:#fff8df;
}

/* TOP BAR */
.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:12px;
}

.topbar b{color:var(--gold)}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1250px;
    min-height:72px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#111;
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.logo span{color:var(--gold2)}

.navlinks{
    display:flex;
    align-items:center;
    gap:23px;
}

.navlinks a{
    font-size:14px;
    font-weight:700;
}

.navlinks a:hover{color:var(--gold2)}

.actions{
    display:flex;
    gap:8px;
}

.icon{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.count{
    position:absolute;
    top:-5px;
    right:-4px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

/* MOBILE NAV */
.mobile-menu{
    display:none;
    border-top:1px solid var(--border);
    background:#fff;
}

.mobile-menu a{
    display:block;
    padding:14px 20px;
    border-bottom:1px solid #eee;
    font-size:14px;
    font-weight:700;
}

/* HERO */
.hero{
    background:
    radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 28%),
    linear-gradient(120deg,#111,#292929);
    color:#fff;
}

.hero-inner{
    max-width:1250px;
    min-height:500px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
}

.badge{
    display:inline-block;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{color:var(--gold)}

.hero p{
    max-width:610px;
    font-size:17px;
    color:#d5d5d5;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{transform:translateY(-2px)}

.primary{background:var(--gold);color:#111}
.white{background:#fff;color:#111}
.dark{background:#111;color:#fff}
.green{background:var(--green);color:#fff}
.outline{background:#fff;border:1px solid #ddd}

.hero-show{
    min-height:340px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-phone{
    width:235px;
    height:320px;
    border-radius:28px;
    overflow:hidden;
    border:6px solid #333;
    background:#222;
    transform:rotate(6deg);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
}

.hero-phone img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-hair{
    position:absolute;
    left:2%;
    bottom:5px;
    width:155px;
    height:195px;
    border:5px solid #fff;
    border-radius:18px;
    overflow:hidden;
    transform:rotate(-8deg);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.hero-hair img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TRUST */
.trust{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.trust-inner{
    max-width:1250px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.trust-item{
    display:flex;
    align-items:center;
    gap:10px;
}

.trust-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.trust-item strong{
    display:block;
    font-size:12px;
}

.trust-item small{
    color:#777;
    font-size:10px;
}

/* SECTIONS */
.section{
    max-width:1250px;
    margin:auto;
    padding:60px 20px;
}

.heading{margin-bottom:25px}

.heading h2{
    font-size:34px;
    letter-spacing:-1px;
}

.heading p{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

/* CATEGORIES */
.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
}

.category{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 8px;
    text-align:center;
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
}

.category .ci{
    font-size:31px;
    margin-bottom:8px;
}

.category strong{font-size:12px}

/* PROMO */
.promo{
    max-width:1210px;
    margin:0 auto;
    border-radius:20px;
    padding:32px;
    background:linear-gradient(110deg,#f5c542,#ffe68a);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.promo h2{font-size:30px}
.promo p{font-size:13px;color:#5b4a10}

/* CONTROLS */
.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.search{
    flex:1;
    min-width:220px;
    position:relative;
}

.search span{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
}

.search input{
    width:100%;
    padding:13px 15px 13px 40px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.filter{
    padding:13px;
    min-width:180px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    outline:none;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    transition:.2s;
    position:relative;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 40px rgba(0,0,0,.08);
}

.card-image{
    height:240px;
    background:#eee;
    position:relative;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.card:hover .card-image img{transform:scale(1.04)}

.product-badge{
    position:absolute;
    top:11px;
    left:11px;
    background:var(--red);
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
    font-weight:900;
    z-index:2;
}

.wish{
    position:absolute;
    right:10px;
    top:10px;
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#fff;
    z-index:3;
}

.wish.active{
    color:var(--red);
}

.info{padding:15px}

.cat{
    color:#999;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.name{
    font-size:15px;
    margin:5px 0 7px;
    min-height:40px;
}

.stars{
    color:#eab300;
    font-size:12px;
    margin-bottom:9px;
}

.price-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:12px;
}

.price{
    font-size:18px;
    font-weight:900;
}

.old{
    color:#aaa;
    font-size:11px;
    text-decoration:line-through;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 43px;
    gap:7px;
}

.add{
    border:0;
    background:#111;
    color:#fff;
    border-radius:9px;
    font-weight:800;
    font-size:12px;
}

.buy{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    font-size:17px;
}

.empty{
    display:none;
    text-align:center;
    background:#fff;
    border-radius:15px;
    padding:50px;
    color:#777;
}

/* FEATURED */
.featured-strip{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.feature-box{
    min-height:190px;
    border-radius:18px;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    color:#fff;
    background:linear-gradient(135deg,#111,#333);
}

.feature-box:nth-child(2){
    background:linear-gradient(135deg,#6b4b13,#d6a82e);
}

.feature-box:nth-child(3){
    background:linear-gradient(135deg,#272727,#555);
}

.feature-box h3{
    font-size:24px;
    margin-bottom:4px;
}

.feature-box p{
    font-size:12px;
    opacity:.85;
}

/* WHY */
.why{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.why-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:26px;
}

.why-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    margin-bottom:14px;
}

.why-card h3{margin-bottom:6px}
.why-card p{font-size:13px;color:#777}

/* NEWSLETTER */
.newsletter{
    background:#111;
    color:#fff;
    border-radius:20px;
    padding:35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.newsletter p{
    color:#aaa;
    font-size:13px;
    margin-top:4px;
}

.newsletter-form{
    display:flex;
    gap:7px;
    width:420px;
}

.newsletter-form input{
    flex:1;
    padding:13px;
    border:0;
    border-radius:8px;
    outline:none;
}

/* FOOTER */
footer{
    background:#111;
    color:#fff;
}

.footer{
    max-width:1250px;
    margin:auto;
    padding:55px 20px 30px;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:35px;
}

.footer p,
.footer a{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:8px;
}

.footer h4{
    color:var(--gold);
    margin-bottom:13px;
}

.bottom{
    border-top:1px solid #292929;
    text-align:center;
    padding:17px;
    font-size:11px;
    color:#777;
}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    right:18px;
    bottom:18px;
    width:57px;
    height:57px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    z-index:1200;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* OVERLAY */
.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:1500;
}

.overlay.show{display:block}

/* CART */
.cart{
    position:fixed;
    right:-460px;
    top:0;
    height:100%;
    width:min(460px,100%);
    background:#fff;
    z-index:1600;
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart.open{right:0}

.cart-head{
    padding:18px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#eee;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px 20px;
}

.cart-item{
    display:grid;
    grid-template-columns:60px 1fr auto;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #eee;
}

.cart-img{
    width:60px;
    height:60px;
    border-radius:9px;
    overflow:hidden;
    background:#eee;
}

.cart-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cart-item h4{font-size:12px}

.cart-price{
    font-size:11px;
    color:#777;
}

.qty{
    display:flex;
    gap:6px;
    align-items:center;
    margin-top:6px;
}

.qty button{
    width:24px;
    height:24px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:5px;
}

.remove{
    border:0;
    background:none;
    color:var(--red);
    font-size:10px;
    margin-top:4px;
}

.cart-foot{
    padding:18px;
    border-top:1px solid #eee;
}

.line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:8px;
}

.total{
    border-top:1px solid #eee;
    padding-top:10px;
    font-size:19px;
    font-weight:900;
}

.checkout{
    width:100%;
    border:0;
    border-radius:9px;
    padding:14px;
    background:var(--green);
    color:#fff;
    font-weight:900;
    margin-top:10px;
}

.delivery-note{
    font-size:10px;
    color:#777;
    margin-top:7px;
}

/* MODALS */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{display:flex}

.modal-box{
    background:#fff;
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    border-radius:18px;
    padding:25px;
    position:relative;
}

.modal-close{
    position:absolute;
    right:15px;
    top:15px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#eee;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.quick-image{
    height:400px;
    background:#eee;
    border-radius:12px;
    overflow:hidden;
}

.quick-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.quick-info{padding-top:20px}

.quick-info h2{
    font-size:27px;
    margin:6px 0;
}

.quick-info p{
    font-size:13px;
    color:#777;
    margin:15px 0;
}

.quick-price{
    font-size:25px;
    font-weight:900;
    margin:15px 0;
}

/* CHECKOUT FORM */
.form-group{margin-bottom:14px}

.form-group label{
    display:block;
    font-size:11px;
    font-weight:800;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.form-group textarea{
    min-height:75px;
    resize:vertical;
}

.delivery-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.delivery-option{
    border:1px solid #ddd;
    border-radius:9px;
    padding:12px;
    cursor:pointer;
}

.delivery-option.active{
    border-color:#d2aa2e;
    background:#fff9e5;
}

.delivery-option strong{
    display:block;
    font-size:12px;
}

.delivery-option small{color:#777}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,100px);
    opacity:0;
    background:#111;
    color:#fff;
    padding:12px 18px;
    border-radius:9px;
    z-index:3000;
    font-size:12px;
    transition:.3s;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* MOBILE BOTTOM */
.mobile-bottom{
    display:none;
}

/* RESPONSIVE */
@media(max-width:1000px){

    .navlinks{display:none}

    .hero-inner{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .trust-inner{
        grid-template-columns:repeat(2,1fr);
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .footer{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){

    .nav{
        padding:9px 13px;
    }

    .logo{font-size:18px}

    .logo-mark{
        width:38px;
        height:38px;
    }

    .hero-inner{
        padding:48px 15px;
    }

    .hero h1{
        font-size:46px;
    }

    .hero-show{
        min-height:280px;
    }

    .hero-phone{
        width:190px;
        height:260px;
    }

    .hero-hair{
        width:120px;
        height:160px;
    }

    .trust-inner{
        gap:8px;
        padding:14px 10px;
    }

    .trust-item small{display:none}

    .section{
        padding:45px 14px;
    }

    .heading h2{
        font-size:28px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }

    .category{
        padding:16px 5px;
    }

    .promo{
        margin:0 14px;
        padding:25px 20px;
        flex-direction:column;
        align-items:flex-start;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card-image{
        height:185px;
    }

    .info{padding:11px}

    .name{
        font-size:13px;
        min-height:48px;
    }

    .price{font-size:16px}

    .product-actions{
        grid-template-columns:1fr;
    }

    .buy{display:none}

    .featured-strip{
        grid-template-columns:1fr;
    }

    .why{
        grid-template-columns:1fr;
    }

    .newsletter{
        padding:27px 20px;
        flex-direction:column;
        align-items:flex-start;
    }

    .newsletter-form{
        width:100%;
        flex-direction:column;
    }

    .footer{
        grid-template-columns:1fr 1fr;
    }

    .footer-brand{
        grid-column:1/-1;
    }

    .quick-grid{
        grid-template-columns:1fr;
    }

    .quick-image{
        height:300px;
    }

    .quick-info{
        padding-top:0;
    }

    .delivery-options{
        grid-template-columns:1fr;
    }

    .mobile-bottom{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        height:62px;
        background:#fff;
        border-top:1px solid #ddd;
        z-index:1100;
        display:grid;
        grid-template-columns:repeat(4,1fr);
    }

    .mobile-bottom button{
        border:0;
        background:#fff;
        font-size:10px;
        font-weight:800;
    }

    .mobile-bottom span{
        display:block;
        font-size:19px;
        margin-bottom:2px;
    }

    body{
        padding-bottom:62px;
    }
}
</style>
</head>

<body>
