<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion, gadgets and accessories. Nationwide delivery across South Africa.">
<title>PM Traders | Online Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f7;
  color:#151515;
  line-height:1.5
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

:root{
  --black:#111;
  --gold:#f5c542;
  --gold2:#c49a20;
  --green:#25d366;
  --red:#d62828;
  --white:#fff;
  --muted:#777;
  --border:#e7e7e7;
}

.topbar{
  background:#111;
  color:#fff;
  text-align:center;
  padding:9px 15px;
  font-size:12px
}
.topbar b{color:#f5c542}

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid var(--border)
}

.nav{
  max-width:1250px;
  min-height:70px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  font-size:20px
}

.logo-mark{
  width:42px;
  height:42px;
  background:#111;
  color:#f5c542;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px
}

.logo span{color:#c49a20}

.navlinks{
  display:flex;
  gap:22px;
  align-items:center
}

.navlinks a{
  font-size:13px;
  font-weight:800
}

.navlinks a:hover{color:#c49a20}

.actions{
  display:flex;
  gap:8px
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid #ddd;
  border-radius:50%;
  background:#fff;
  position:relative;
  font-size:17px
}

.cart-count{
  position:absolute;
  right:-4px;
  top:-5px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  background:#d62828;
  color:#fff;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center
}

.hero{
  background:
    radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 30%),
    linear-gradient(120deg,#111,#292929);
  color:#fff
}

.hero-inner{
  max-width:1250px;
  min-height:490px;
  margin:auto;
  padding:65px 20px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  gap:40px
}

.badge{
  display:inline-block;
  padding:8px 13px;
  border-radius:30px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  font-size:12px;
  margin-bottom:18px
}
