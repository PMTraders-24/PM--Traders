<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Online Store</title>

<meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion, gadgets and accessories. Nationwide delivery across South Africa.">
<meta name="theme-color" content="#111111">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#171717;
    line-height:1.5;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

:root{
    --black:#111;
    --black2:#222;
    --gold:#f5c542;
    --gold-dark:#c49a20;
    --white:#fff;
    --muted:#777;
    --border:#e7e7e7;
    --green:#25d366;
    --red:#d62828;
    --cream:#fff8df;
}

/* TOP BAR */
.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:12px;
}

.topbar strong{color:var(--gold)}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1250px;
    min-height:72px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#111;
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.logo span{color:var(--gold-dark)}

.navlinks{
    display:flex;
    align-items:center;
    gap:23px;
}

.navlinks a{
    font-size:14px;
    font-weight:700;
}

.navlinks a:hover{color:var(--gold-dark)}

.actions{
    display:flex;
    gap:8px;
}

.icon{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

/* HERO */
.hero{
    background:
    radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 28%),
    linear-gradient(120deg,#111,#292929);
    color:#fff;
}

.hero-inner{
    max-width:1250px;
    min-height:500px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
}

.badge{
    display:inline-block;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{color:var(--gold)}

.hero p{
    max-width:610px;
    font-size:17px;
    color:#d5d5d5;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{transform:translateY(-2px)}

.primary{background:var(--gold);color:#111}
.white{background:#fff;color:#111}
.dark{background:#111;color:#fff}
.green{background:var(--green);color:#fff}

.hero-show{
    min-height:340px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-phone{
    width:235px;
    height:320px;
    border-radius:28px;
    overflow:hidden;
    border:6px solid #333;
    background:#222;
    transform:rotate(6deg);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
}

.hero-phone img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-hair{
    position:absolute;
    left:2%;
    bottom:5px;
    width:155px;
    height:195px;
    border:5px solid #fff;
    border-radius:18px;
    overflow:hidden;
    transform:rotate(-8deg);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.hero-hair img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TRUST */
.trust{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.trust-inner{
    max-width:1250px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.trust-item{
    display:flex;
    align-items:center;
    gap:10px;
}

.trust-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.trust-item strong{
    display:block;
    font-size:12px;
}

.trust-item small{
    color:#777;
    font-size:10px;
}

/* SECTIONS */
.section{
    max-width:1250px;
    margin:auto;
    padding:60px 20px;
}

.heading{margin-bottom:25px}

.heading h2{
    font-size:34px;
    letter-spacing:-1px;
}

.heading p{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

/* CATEGORIES */
.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
}

.category{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px 8px;
    text-align:center;
    transition:.2s;
    cursor:pointer;
}

.category:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
}

.category .ci{
    font-size:31px;
    margin-bottom:8px;
}

.category strong{font-size:12px}

/* PROMO */
.promo{
    max-width:1210px;
    margin:0 auto;
    border-radius:20px;
    padding:32px;
    background:linear-gradient(110deg,#f5c542,#ffe68a);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.promo h2{font-size:30px}

.promo p{
    font-size:13px;
    color:#5b4a10;
}

/* CONTROLS */
.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.search{
    flex:1;
    min-width:220px;
    position:relative;
}

.search span{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
}

.search input{
    width:100%;
    padding:13px 15px 13px 40px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    background:#fff;
}

.filter{
    padding:13px;
    min-width:190px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    outline:none;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 40px rgba(0,0,0,.08);
}

.card-image{
    height:250px;
    background:#eee;
    position:relative;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.card:hover .card-image img{transform:scale(1.04)}

.badge-sale{
    position:absolute;
    left:10px;
    top:10px;
    background:var(--red);
    color:#fff;
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
    font-weight:900;
}

.stock{
    position:absolute;
    right:10px;
    top:10px;
    background:#fff;
    color:#16833a;
    padding:5px 8px;
    border-radius:6px;
    font-size:9px;
    font-weight:900;
}

.stock.request{color:#777}

.info{padding:15px}

.cat{
    color:#999;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.name{
    font-size:15px;
    margin:5px 0 7px;
    min-height:42px;
}

.stars{
    color:#eab300;
    font-size:12px;
    margin-bottom:8px;
}

.price-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
}

.price{
    font-size:18px;
    font-weight:900;
}

.price-request{
    font-size:14px;
    font-weight:800;
}

.old{
    color:#aaa;
    font-size:11px;
    text-decoration:line-through;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 43px;
    gap:7px;
}

.add{
    border:0;
    background:#111;
    color:#fff;
    border-radius:9px;
    font-weight:800;
    font-size:12px;
    padding:12px;
}

.add:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.view{
    border:1px solid #ddd;
    background:#fff;
    border-radius:9px;
    font-size:17px;
}

.empty{
    display:none;
    text-align:center;
    background:#fff;
    border-radius:15px;
    padding:50px;
    color:#777;
}

/* WHY */
.why{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.why-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:26px;
}

.why-icon{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    margin-bottom:14px;
}

.why-card h3{margin-bottom:6px}

.why-card p{
    font-size:13px;
    color:#777;
}

/* NEWSLETTER */
.newsletter{
    background:#111;
    color:#fff;
    border-radius:20px;
    padding:35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.newsletter p{
    color:#aaa;
    font-size:13px;
    margin-top:4px;
}

.newsletter-form{
    display:flex;
    gap:7px;
    width:420px;
}

.newsletter-form input{
    flex:1;
    padding:13px;
    border:0;
    border-radius:8px;
    outline:none;
}

/* FOOTER */
footer{
    background:#111;
    color:#fff;
}

.footer{
    max-width:1250px;
    margin:auto;
    padding:55px 20px 30px;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:35px;
}

.footer p,.footer a{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:8px;
}

.footer a:hover{color:var(--gold)}

.footer h4{
    color:var(--gold);
    margin-bottom:13px;
}

.bottom{
    border-top:1px solid #292929;
    text-align:center;
    padding:17px;
    font-size:11px;
    color:#777;
}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    right:18px;
    bottom:18px;
    width:57px;
    height:57px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    z-index:1200;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

/* CART */
.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:1500;
}

.overlay.show{display:block}

.cart{
    position:fixed;
    right:-460px;
    top:0;
    height:100%;
    width:min(460px,100%);
    background:#fff;
    z-index:1600;
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart.open{right:0}

.cart-head{
    padding:18px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#f2f2f2;
    font-size:20px;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px;
}

.cart-empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

.cart-item{
    display:grid;
    grid-template-columns:70px 1fr auto;
    gap:12px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-item img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.cart-item h4{font-size:13px}

.cart-item small{
    color:#777;
    display:block;
    margin:4px 0;
}

.qty{
    display:flex;
    align-items:center;
    gap:6px;
}

.qty button{
    width:27px;
    height:27px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:6px;
}

.remove{
    border:0;
    background:none;
    color:var(--red);
    font-size:11px;
    margin-top:5px;
}

.cart-bottom{
    border-top:1px solid #eee;
    padding:17px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:13px;
}

.summary-total{
    font-size:19px;
    font-weight:900;
    padding-top:10px;
    margin-top:10px;
    border-top:1px solid #eee;
}

.cart-bottom .btn{
    width:100%;
    margin-top:12px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1800;
    background:rgba(0,0,0,.65);
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    position:relative;
}

.modal-close{
    position:absolute;
    right:15px;
    top:15px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#fff;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    z-index:5;
    font-size:20px;
}

.product-detail{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.detail-gallery{
    padding:25px;
    background:#f5f5f5;
}

.main-product-image{
    width:100%;
    height:430px;
    object-fit:cover;
    border-radius:15px;
    background:#eee;
}

.thumbs{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.thumb{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid transparent;
    cursor:pointer;
}

.thumb.active{border-color:var(--gold-dark)}

.detail-info{padding:40px 30px}

.detail-cat{
    color:#999;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.detail-info h2{
    font-size:31px;
    line-height:1.1;
    margin:8px 0 10px;
}

.detail-price{
    font-size:25px;
    font-weight:900;
    margin:15px 0;
}

.detail-old{
    font-size:14px;
    color:#999;
    text-decoration:line-through;
    margin-left:8px;
}

.detail-description{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

.detail-stock{
    display:inline-block;
    padding:7px 10px;
    border-radius:7px;
    background:#e9f8ee;
    color:#16833a;
    font-size:11px;
    font-weight:800;
    margin-bottom:20px;
}

.detail-actions{
    display:flex;
    gap:8px;
}

.detail-actions .btn{flex:1}

/* CHECKOUT */
.checkout-modal .modal-box{
    max-width:700px;
}

.checkout{
    padding:30px;
}

.checkout h2{margin-bottom:5px}

.checkout-sub{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.form-group.full{grid-column:1/-1}

.form-group label{
    font-size:11px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    background:#fff;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.delivery-box{
    margin:20px 0;
    padding:15px;
    border-radius:10px;
    background:#fff8df;
    font-size:12px;
}

.checkout-summary{
    background:#f7f7f7;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.success{
    display:none;
    text-align:center;
    padding:50px 25px;
}

.success .success-icon{
    width:70px;
    height:70px;
    background:#e9f8ee;
    color:#16833a;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin:0 auto 15px;
}

/* MOBILE MENU */
.mobile-menu{
    display:none;
    border-top:1px solid #eee;
    padding:15px 20px;
    background:#fff;
}

.mobile-menu a{
    display:block;
    padding:10px 0;
    font-weight:700;
    font-size:14px;
}

.menu-btn{display:none}

/* TOAST */
.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    background:#111;
    color:#fff;
    padding:13px 18px;
    border-radius:10px;
    z-index:3000;
    font-size:12px;
    transition:.3s;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.toast.show{
    transform:translate(-50%,0);
}

/* RESPONSIVE */
@media(max-width:1050px){
    .products{grid-template-columns:repeat(3,1fr)}
    .categories{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:800px){
    .navlinks{display:none}
    .menu-btn{display:flex}

    .hero-inner{
        grid-template-columns:1fr;
        padding-top:50px;
    }

    .hero-show{min-height:300px}

    .trust-inner{
        grid-template-columns:repeat(2,1fr);
    }

    .products{grid-template-columns:repeat(2,1fr)}

    .why{grid-template-columns:1fr}

    .newsletter{
        flex-direction:column;
        align-items:stretch;
    }

    .newsletter-form{width:100%}

    .footer{
        grid-template-columns:1fr 1fr;
    }

    .product-detail{
        grid-template-columns:1fr;
    }

    .main-product-image{height:350px}
}

@media(max-width:560px){
    .topbar{font-size:10px}

    .nav{padding:9px 13px}

    .logo{font-size:17px}

    .logo-mark{
        width:38px;
        height:38px;
    }

    .actions .icon{
        width:38px;
        height:38px;
    }

    .hero-inner{
        min-height:auto;
        padding:50px 18px 40px;
    }

    .hero h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .hero p{font-size:14px}

    .hero-phone{
        width:190px;
        height:260px;
    }

    .hero-hair{
        width:120px;
        height:155px;
    }

    .trust-inner{
        grid-template-columns:1fr 1fr;
        padding:15px;
    }

    .trust-item strong{font-size:10px}

    .section{padding:45px 15px}

    .heading h2{font-size:28px}

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .promo{
        margin:0 15px;
        padding:24px;
        flex-direction:column;
        align-items:flex-start;
    }

    .promo h2{font-size:24px}

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .card-image{height:190px}

    .info{padding:11px}

    .name{
        font-size:13px;
        min-height:38px;
    }

    .price{font-size:16px}

    .add{padding:10px 5px}

    .view{font-size:14px}

    .footer{
        grid-template-columns:1fr;
        gap:25px;
    }

    .newsletter{padding:25px}
