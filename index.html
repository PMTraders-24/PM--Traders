<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PM Traders | Online Store</title><meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion and accessories. Nationwide delivery across South Africa.">
<meta name="keywords" content="PM Traders, iPhone, human hair, weave, ladies fashion, Richards Bay, South Africa">
<meta name="theme-color" content="#111111"><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#171717;
    line-height:1.5;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

:root{
    --black:#111;
    --gold:#f5c542;
    --gold-dark:#b88c12;
    --white:#fff;
    --light:#f7f7f7;
    --border:#e8e8e8;
    --muted:#777;
    --red:#d62828;
    --green:#25d366;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:12px;
}

.top-bar strong{
    color:var(--gold);
}

/* =========================
   HEADER
========================= */

header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid var(--border);
}

.navbar{
    max-width:1280px;
    margin:auto;
    min-height:75px;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}

.logo-mark{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#111;
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.logo-text{
    font-size:21px;
    letter-spacing:-.7px;
}

.logo-text span{
    color:var(--gold-dark);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-links a{
    font-size:14px;
    font-weight:700;
}

.nav-links a:hover{
    color:var(--gold-dark);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid #ddd;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    position:relative;
}

.cart-count{
    position:absolute;
    right:-4px;
    top:-5px;
    min-width:20px;
    height:20px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    font-weight:900;
}

.mobile-menu{
    display:none;
}

/* =========================
   HERO
========================= */

.hero{
    background:
        radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 28%),
        linear-gradient(120deg,#111,#292929);
    color:#fff;
    overflow:hidden;
}

.hero-inner{
    max-width:1280px;
    margin:auto;
    padding:75px 20px;
    min-height:500px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
}

.hero-badge{
    display:inline-block;
    padding:8px 14px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(43px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{
    color:var(--gold);
}

.hero p{
    max-width:620px;
    color:#d5d5d5;
    font-size:17px;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--gold);
    color:#111;
}

.btn-light{
    background:#fff;
    color:#111;
}

.btn-dark{
    background:#111;
    color:#fff;
}

.hero-showcase{
    min-height:350px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-phone{
    width:245px;
    height:330px;
    border-radius:28px;
    overflow:hidden;
    transform:rotate(6deg);
    border:6px solid #333;
    background:#222;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
}

.hero-phone img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-hair{
    position:absolute;
    left:3%;
    bottom:15px;
    width:160px;
    height:200px;
    border-radius:20px;
    overflow:hidden;
    transform:rotate(-9deg);
    border:5px solid #fff;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.hero-hair img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   TRUST
========================= */

.trust-bar{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.trust-inner{
    max-width:1280px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.trust-item{
    display:flex;
    align-items:center;
    gap:10px;
}

.trust-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.trust-item strong{
    display:block;
    font-size:12px;
}

.trust-item span{
    display:block;
    color:#777;
    font-size:11px;
}

/* =========================
   SECTIONS
========================= */

.section{
    max-width:1280px;
    margin:auto;
    padding:65px 20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:27px;
}

.section-title{
    font-size:34px;
    letter-spacing:-1.3px;
}

.section-subtitle{
    color:#777;
    font-size:13px;
    margin-top:5px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.category{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:23px 10px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.category:hover{
    transform:translateY(-4px);
    border-color:var(--gold);
    box-shadow:0 12px 30px rgba(0,0,0,.07);
}

.category-icon{
    font-size:32px;
    margin-bottom:8px;
}

.category strong{
    font-size:12px;
}

/* =========================
   PROMO
========================= */

.promo{
    max-width:1240px;
    margin:0 auto;
    border-radius:20px;
    padding:34px;
    background:linear-gradient(110deg,#f5c542,#ffe68a);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.promo h2{
    font-size:30px;
}

.promo p{
    color:#5d4a10;
    font-size:13px;
    margin-top:4px;
}

/* =========================
   SHOP CONTROLS
========================= */

.shop-controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.search-box{
    flex:1;
    min-width:230px;
    position:relative;
}

.search-box span{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
}

.search-box input{
    width:100%;
    padding:14px 15px 14px 42px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    outline:none;
}

.search-box input:focus,
.filter-select:focus{
    border-color:var(--gold-dark);
}

.filter-select{
    min-width:180px;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
    outline:none;
}

/* =========================
   PRODUCTS
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 45px rgba(0,0,0,.09);
}

.product-image{
    height:260px;
    background:#f1f1f1;
    position:relative;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.product-card:hover .product-image img{
    transform:scale(1.04);
}

.product-badge{
    position:absolute;
    top:12px;
    left:12px;
    z-index:2;
    background:var(--red);
    color:#fff;
    padding:6px 9px;
    border-radius:7px;
    font-size:9px;
    font-weight:900;
}

.quick-view-btn{
    position:absolute;
    right:10px;
    top:10px;
    z-index:3;
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.95);
}

.product-info{
    padding:15px;
}

.product-category{
    color:#999;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:800;
}

.product-name{
    font-size:15px;
    margin:5px 0 7px;
    min-height:42px;
}

.rating{
    color:#eab300;
    font-size:12px;
    margin-bottom:9px;
}

.price-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:13px;
}

.price{
    font-size:18px;
    font-weight:900;
}

.old-price{
    color:#aaa;
    text-decoration:line-through;
    font-size:11px;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 43px;
    gap:7px;
}

.add-cart{
    border:0;
    border-radius:9px;
    background:#111;
    color:#fff;
    font-weight:800;
    font-size:12px;
}

.add-cart:hover{
    background:#292929;
}

.buy-now{
    border:1px solid #ddd;
    border-radius:9px;
    background:#fff;
    font-size:17px;
}

.empty-state{
    display:none;
    background:#fff;
    border-radius:15px;
    padding:50px 20px;
    text-align:center;
    color:#777;
}

/* =========================
   WHY US
========================= */

.why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.why-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:27px;
}

.why-icon{
    width:47px;
    height:47px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    margin-bottom:15px;
}

.why-card h3{
    margin-bottom:7px;
}

.why-card p{
    color:#777;
    font-size:13px;
}

/* =========================
   REVIEWS
========================= */

.reviews{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.review{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:25px;
}

.review-stars{
    color:#eab300;
    margin-bottom:10px;
}

.review p{
    color:#555;
    font-size:13px;
    margin-bottom:13px;
}

.review strong{
    font-size:12px;
}

/* =========================
   NEWSLETTER
========================= */

.newsletter{
    background:#111;
    color:#fff;
    border-radius:20px;
    padding:38px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.newsletter h2{
    font-size:28px;
}

.newsletter p{
    color:#aaa;
    font-size:13px;
    margin-top:5px;
}

.newsletter-form{
    width:420px;
    display:flex;
    gap:8px;
}

.newsletter-form input{
    flex:1;
    border:0;
    padding:13px;
    border-radius:8px;
    outline:none;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#111;
    color:#fff;
}

.footer-main{
    max-width:1280px;
    margin:auto;
    padding:55px 20px 35px;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:35px;
}

.footer-brand p,
.footer-col p,
.footer-col a{
    color:#999;
    font-size:12px;
}

.footer-brand p{
    max-width:330px;
    margin-top:12px;
    line-height:1.7;
}

.footer-col h4{
    color:var(--gold);
    margin-bottom:14px;
}

.footer-col a,
.footer-col p{
    display:block;
    margin-bottom:8px;
}

.footer-col a:hover{
    color:#fff;
}

.footer-bottom{
    border-top:1px solid #292929;
    padding:18px;
    text-align:center;
    color:#777;
    font-size:11px;
}

/* =========================
   WHATSAPP
========================= */

.whatsapp{
    position:fixed;
    right:18px;
    bottom:18px;
    width:57px;
    height:57px;
    border-radius:50%;
    background:var(--green);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    z-index:900;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}

/* =========================
   CART
========================= */

.cart-drawer{
    position:fixed;
    top:0;
    right:-460px;
    width:min(460px,100%);
    height:100%;
    background:#fff;
    z-index:1600;
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart-drawer.active{
    right:0;
}

.cart-header{
    padding:19px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cart-header h2{
    font-size:21px;
}

.close-btn{
    width:37px;
    height:37px;
    border:0;
    border-radius:50%;
    background:#f2f2f2;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px 20px;
}

.cart-item{
    display:grid;
    grid-template-columns:60px 1fr auto;
    gap:10px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.cart-item-image{
    width:60px;
    height:60px;
    border-radius:9px;
    overflow:hidden;
    background:#eee;
}

.cart-item-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cart-item h4{
    font-size:12px;
}

.cart-item-price{
    color:#777;
    font-size:11px;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:6px;
}

.qty-controls button{
    width:24px;
    height:24px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:5px;
}

.remove-item{
    border:0;
    background:none;
    color:var(--red);
    font-size:10px;
    margin-top:5px;
}

.cart-footer{
    border-top:1px solid #eee;
    padding:18px;
}

.summary-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:8px;
}

.summary-total{
    border-top:1px solid #eee;
    padding-top:10px;
    margin-top:10px;
    font-size:20px;
    font-weight:900;
}

.checkout-btn{
    width:100%;
    border:0;
    border-radius:10px;
    background:var(--green);
    color:#fff;
    padding:14px;
    font-weight:900;
    margin-top:12px;
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(720px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:25px;
    position:relative;
}

.modal-close{
    position:absolute;
    right:15px;
    top:15px;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#eee;
}

.quick-view{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.quick-image{
    height:420px;
    background:#f2f2f2;
    border-radius:12px;
    overflow:hidden;
}

.quick-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.quick-info{
    padding-top:25px;
}

.quick-info h2{
    font-size:28px;
    margin:7px 0;
}

.quick-info p{
    color:#777;
    font-size:13px;
    margin:12px 0 20px;
}

/* =========================
   CHECKOUT
========================= */

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:11px;
    font-weight:800;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.form-group textarea{
    min-height:75px;
    resize:vertical;
}

.delivery-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.delivery-option{
    border:1px solid #ddd;
    border-radius:9px;
    padding:12px;
    cursor:pointer;
}

.delivery-option.active{
    border-color:#d5ae32;
    background:#fff9e7;
}

.delivery-option strong{
    display:block;
    font-size:12px;
}

.delivery-option span{
    color:#777;
    font-size:10px;
}

.location-box{
    display:none;
    margin-top:10px;
}

.location-box.active{
    display:block;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    background:#111;
    color:#fff;
    padding:12px 18px;
    border-radius:9px;
    z-index:3000;
    opacity:0;
    transition:.3s;
    font-size:12px;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1050px){

    .nav-links{
        display:none;
    }

    .mobile-menu{
        display:flex;
    }

    .hero-inner{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .trust-inner{
        grid-template-columns:repeat(2,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .footer-main{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){

    .navbar{
        padding:9px 13px;
    }

    .logo-text{
        font-size:18px;
    }

    .logo-mark{
        width:38px;
        height:38px;
    }

    .hero-inner{
        padding:50px 15px;
    }

    .hero h1{
        font-size:45px;
    }

    .hero p{
        font-size:14px;
    }

    .hero-showcase{
        min-height:285px;
    }

    .hero-phone{
        width:190px;
        height:260px;
    }

    .hero-hair{
        width:120px;
        height:160px;
        left:0;
    }

    .trust-inner{
        padding:15px 10px;
        gap:8px;
    }

    .trust-item span{
        display:none;
    }

    .section{
        padding:45px 14px;
    }

    .section-title{
        font-size:28px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
    }

    .category{
        padding:17px 5px;
    }

    .category-icon{
        font-size:27px;
    }

    .promo{
        margin:0 14px;
        padding:25px 20px;
        flex-direction:column;
        align-items:flex-start;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
