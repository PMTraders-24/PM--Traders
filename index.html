<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Online Store</title>

<meta name="description" content="PM Traders — smartphones, human hair, fashion, gadgets and accessories.">

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f5f5;
color:#111
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.topbar{
background:#111;
color:#fff;
text-align:center;
padding:10px;
font-size:12px;
font-weight:800
}

header{
background:#fff;
min-height:72px;
padding:12px 5%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:500
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:18px;
font-weight:900;
text-decoration:none;
color:#111
}

.logoBox{
width:43px;
height:43px;
background:#111;
color:#fff;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center
}

nav{
display:flex;
gap:22px
}

nav a{
color:#333;
text-decoration:none;
font-weight:800;
font-size:14px
}

.headerActions{
display:flex;
align-items:center;
gap:8px
}

.cartButton,
.menuButton{
background:#111;
color:#fff;
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:800
}

.menuButton{display:none}

/* MOBILE NAV */

.mobileNav{
display:none;
background:#fff;
padding:15px 5%;
border-bottom:1px solid #ddd
}

.mobileNav.show{display:block}

.mobileNav a{
display:block;
padding:12px 0;
color:#111;
text-decoration:none;
font-weight:800
}

/* HERO */

.hero{
background:#111;
color:#fff;
min-height:540px;
padding:70px 7%;
display:grid;
grid-template-columns:1.15fr .85fr;
align-items:center;
gap:40px
}

.hero small{
color:#aaa;
font-size:12px;
font-weight:900;
letter-spacing:2px
}

.hero h1{
margin:18px 0;
font-size:clamp(48px,7vw,82px);
line-height:.95;
letter-spacing:-4px
}

.hero h1 span{color:#aaa}

.hero p{
max-width:600px;
color:#ccc;
font-size:18px;
line-height:1.6
}

.heroButtons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:22px
}

.shopButton,
.outlineButton{
display:inline-block;
padding:14px 22px;
border-radius:9px;
text-decoration:none;
font-weight:900
}

.shopButton{
background:#fff;
color:#111
}

.outlineButton{
border:1px solid #666;
color:#fff
}

.heroVisual{
display:flex;
justify-content:center;
align-items:center
}

.pmCircle{
width:280px;
height:280px;
border-radius:50%;
background:#fff;
color:#111;
display:flex;
align-items:center;
justify-content:center;
font-size:82px;
font-weight:900;
box-shadow:0 20px 80px rgba(255,255,255,.15)
}

/* TRUST */

.trust{
background:#fff;
display:grid;
grid-template-columns:repeat(4,1fr);
padding:22px 6%;
border-bottom:1px solid #ddd
}

.trustBox{
text-align:center;
padding:10px;
border-right:1px solid #eee
}

.trustBox:last-child{border:0}

.trustBox strong{
display:block;
margin-bottom:5px
}

.trustBox span{
font-size:13px;
color:#777
}

/* GENERAL */

.sectionTitle{
text-align:center;
margin-bottom:35px
}

.sectionTitle small{
color:#777;
font-size:11px;
font-weight:900;
letter-spacing:2px
}

.sectionTitle h2{
margin:8px 0;
font-size:42px;
letter-spacing:-2px
}

.sectionTitle p{color:#777}

/* CATEGORIES */

.categories{
background:#fff;
padding:70px 6%
}

.categoryGrid{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.category{
border:1px solid #ddd;
background:#fafafa;
border-radius:15px;
padding:28px 15px;
text-align:center;
font-weight:900;
transition:.2s
}

.category:hover{
background:#111;
color:#fff;
transform:translateY(-3px)
}

.categoryIcon{
display:block;
font-size:38px;
margin-bottom:12px
}

/* SHOP */

.shop{
max-width:1500px;
margin:auto;
padding:75px 5%
}

.filters{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:35px
}

.filters input,
.filters select{
height:48px;
padding:0 15px;
background:#fff;
border:1px solid #ddd;
border-radius:9px;
outline:none
}

.filters input{width:320px}

/* PRODUCTS */

#productGrid{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:22px
}

.productCard{
background:#fff;
border:1px solid #ddd;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.06);
transition:.2s
}

.productCard:hover{
transform:translateY(-5px);
box-shadow:0 15px 35px rgba(0,0,0,.12)
}

.productImage{
height:290px;
background:#f2f2f2;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
position:relative
}

/* SELF-CONTAINED PRODUCT VISUALS */

.visual{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
position:relative
}

/* PHONE */

.phone{
width:120px;
height:225px;
background:#151515;
border:5px solid #333;
border-radius:22px;
position:relative;
box-shadow:0 15px 30px rgba(0,0,0,.25)
}

.phoneScreen{
position:absolute;
inset:9px;
border-radius:15px;
background:linear-gradient(145deg,#111,#555);
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:22px;
font-weight:900
}

.camera{
position:absolute;
top:12px;
left:12px;
width:35px;
height:35px;
border-radius:10px;
background:#222
}

.camera:before,
.camera:after{
content:"";
position:absolute;
width:10px;
height:10px;
background:#777;
border-radius:50%
}

.camera:before{
top:5px;
left:5px
}

.camera:after{
bottom:5px;
right:5px
}

/* HAIR */

.hairVisual{
width:180px;
height:210px;
position:relative
}

.hairTop{
position:absolute;
top:10px;
left:25px;
width:130px;
height:80px;
border-radius:50% 50% 45% 45%;
background:#151515
}

.hairStrand{
position:absolute;
top:60px;
width:45px;
height:130px;
border-radius:50%;
background:#202020
}

.hairStrand.one{left:20px;transform:rotate(12deg)}
.hairStrand.two{left:55px;transform:rotate(-3deg)}
.hairStrand.three{left:90px;transform:rotate(5deg)}
.hairStrand.four{left:125px;transform:rotate(-12deg)}

/* DRESS */

.dressVisual{
position:relative;
width:160px;
height:230px
}

.dressTop{
position:absolute;
top:15px;
left:55px;
width:50px;
height:60px;
border-radius:20px 20px 10px 10px;
background:#222
}

.dressBody{
position:absolute;
top:60px;
left:20px;
width:120px;
height:150px;
background:#111;
clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)
}

.dressBelt{
position:absolute;
top:80px;
left:40px;
width:80px;
height:8px;
background:#777
}

/* ACCESSORIES */

.accessoryVisual{
width:190px;
height:190px;
position:relative
}

.headphone{
position:absolute;
width:130px;
height:130px;
border:15px solid #222;
border-bottom:0;
border-radius:70px 70px 0 0;
left:30px;
top:25px
}

.ear{
position:absolute;
width:35px;
height:65px;
background:#111;
border-radius:12px;
top:105px
}

.ear.left{left:20px}
.ear.right{right:20px}

/* PRODUCT BODY */

.productBody{
padding:18px
}

.tag{
display:inline-block;
background:#eee;
padding:5px 9px;
border-radius:20px;
font-size:9px;
font-weight:900
}

.productBody h3{
min-height:42px;
font-size:16px;
margin:12px 0
}

.price{
font-size:21px;
font-weight:900;
margin:10px 0
}

.productButtons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:15px
}

.addButton,
.viewButton{
border:0;
border-radius:8px;
padding:12px 7px;
font-size:12px;
font-weight:900
}

.addButton{
background:#111;
color:#fff
}

.viewButton{
background:#eee;
color:#111
}

.noProducts{
grid-column:1/-1;
text-align:center;
background:#fff;
padding:45px;
border-radius:15px;
color:#777
}

/* PROMO */

.promo{
margin:0 5% 70px;
padding:40px;
background:#111;
color:#fff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px
}

.promo h2{margin:0 0 8px}

.promo p{
color:#bbb;
margin:0
}

.promo a{
background:#fff;
color:#111;
padding:13px 20px;
border-radius:8px;
text-decoration:none;
font-weight:900
}

/* DELIVERY */

.delivery{
background:#111;
color:#fff;
padding:75px 7%
}

.delivery h2{
font-size:45px;
letter-spacing:-2px;
max-width:700px
}

.deliveryGrid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px
}

.deliveryBox{
background:#181818;
border:1px solid #333;
border-radius:12px;
padding:25px;
color:#ccc
}

.deliveryBox strong{
display:block;
color:#fff;
margin-bottom:8px
}

/* WHY */

.why{
background:#fff;
padding:75px 7%
}

.whyGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.whyBox{
border:1px solid #ddd;
border-radius:15px;
padding:30px
}

.whyBox span{font-size:32px}

.whyBox p{
color:#777;
line-height:1.6
}

/* CONTACT */

.contact{
text-align:center;
padding:75px 7%;
background:#f5f5f5
}

.whatsapp{
display:inline-block;
background:#111;
color:#fff;
padding:14px 22px;
border-radius:9px;
text-decoration:none;
font-weight:900
}

/* FOOTER */

footer{
background:#080808;
color:#aaa;
padding:35px 6%;
display:flex;
justify-content:space-between;
gap:20px;
flex-wrap:wrap
}

/* CART */

#shade{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
z-index:900
}

#shade.show{display:block}

#cartPanel{
position:fixed;
top:0;
right:-450px;
width:min(430px,94vw);
height:100vh;
background:#fff;
z-index:1000;
padding:25px;
overflow-y:auto;
transition:right .3s
}

#cartPanel.open{right:0}

.cartHead{
display:flex;
justify-content:space-between;
border-bottom:1px solid #ddd;
padding-bottom:15px
}

.closeButton{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#eee;
font-size:20px
}

.cartItem{
padding:15px 0;
border-bottom:1px solid #eee
}

.cartItemTop{
display:flex;
justify-content:space-between;
gap:10px
}

.cartItemName{font-weight:800}

.cartItemPrice{font-weight:900}

.quantity{
display:flex;
align-items:center;
gap:8px;
margin-top:10px
}

.quantity button{
width:30px;
height:30px;
border:0;
border-radius:6px;
background:#eee
}

.removeButton{
border:0;
background:transparent;
color:#a00000;
font-size:12px;
padding:7px 0
}

.fullButton{
width:100%;
padding:14px;
border:0;
border-radius:8px;
background:#111;
color:#fff;
font-weight:900;
margin-top:12px
}

/* MODALS */

.modal{
position:fixed;
inset:0;
z-index:1100;
background:rgba(0,0,0,.65);
display:none;
align-items:center;
justify-content:center;
padding:20px
}

.modal.show{display:flex}

.modalBox{
width:min(520px,100%);
max-height:90vh;
overflow-y:auto;
background:#fff;
border-radius:15px;
padding:30px;
position:relative
}
