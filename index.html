*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f6f6;
    color:#161616;
    line-height:1.5
}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

:root{
    --black:#111;
    --gold:#f5c542;
    --gold-dark:#bd9219;
    --white:#fff;
    --muted:#777;
    --border:#e7e7e7;
    --green:#25d366;
    --red:#d62828;
}

.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 14px;
    font-size:12px
}
.topbar strong{color:var(--gold)}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid var(--border)
}
.nav{
    max-width:1250px;
    margin:auto;
    min-height:70px;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px
}
.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:20px;
    font-weight:900
}
.logo-mark{
    width:42px;
    height:42px;
    border-radius:11px;
    background:#111;
    color:var(--gold);
    display:grid;
    place-items:center;
    font-size:15px
}
.logo span{color:var(--gold-dark)}

.navlinks{
    display:flex;
    gap:23px;
    align-items:center
}
.navlinks a{
    font-size:13px;
    font-weight:800
}
.navlinks a:hover{color:var(--gold-dark)}

.actions{
    display:flex;
    gap:7px
}
.icon{
    position:relative;
    width:42px;
    height:42px;
    border:1px solid #ddd;
    border-radius:50%;
    background:#fff;
    display:grid;
    place-items:center
}
.count{
    position:absolute;
    right:-4px;
    top:-5px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:10px;
    display:grid;
    place-items:center;
    font-weight:900
}

.hero-inner{

    min-height:470px;
    margin:auto;
    padding:65px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:30px
}
.badge{
    display:inline-block;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);
    padding:8px 13px;
    border-radius:30px;
    font-size:11px;
    margin-bottom:17px
}
.hero h1{
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:20px
}
.hero h1 span{color:var(--gold)}
.hero p{
    color:#d4d4d4;
    max-width:600px;
    font-size:16px;
    margin-bottom:25px
}
.hero-buttons{
    display:flex;
    gap:9px;
    flex-wrap:wrap
}
.btn{
    border:0;
    border-radius:9px;
    padding:13px 19px;
    font-weight:900;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px
}
.btn:hover{transform:translateY(-2px)}
.primary{background:var(--gold);color:#111}
.white{background:#fff;color:#111}
.dark{background:#111;color:#fff}
