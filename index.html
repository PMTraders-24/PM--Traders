<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Online Store</title>

<meta name="description" content="PM Traders - Smartphones, human hair, ladies fashion, gadgets and accessories. Nationwide delivery across South Africa.">

<meta name="theme-color" content="#111111">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#171717;
    line-height:1.5;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

:root{
    --black:#111111;
    --black2:#202020;
    --gold:#f5c542;
    --gold2:#c49a20;
    --white:#ffffff;
    --muted:#777777;
    --border:#e7e7e7;
    --green:#25d366;
    --red:#d62828;
    --cream:#fff8df;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:12px;
}

.topbar b{
    color:var(--gold);
}

/* =========================
   HEADER
========================= */

header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1250px;
    margin:auto;
    min-height:72px;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#111;
    color:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    flex-shrink:0;
}

.logo span{
    color:var(--gold2);
}

.navlinks{
    display:flex;
    gap:23px;
    align-items:center;
}

.navlinks a{
    font-size:14px;
    font-weight:700;
}

.navlinks a:hover{
    color:var(--gold2);
}

.actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.icon{
    width:42px;
    height:42px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.icon:hover{
    background:#f8f8f8;
}

.count{
    position:absolute;
    top:-5px;
    right:-4px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:var(--red);
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

/* =========================
   HERO
========================= */

.hero{
    background:
    radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 28%),
    linear-gradient(120deg,#111,#292929);
    color:#fff;
}

.hero-inner{
    max-width:1250px;
    margin:auto;
    min-height:500px;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
}

.badge{
    display:inline-block;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    font-size:12px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(45px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{
    color:var(--gold);
}

.hero p{
    max-width:610px;
    font-size:17px;
    color:#d5d5d5;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    background:var(--gold);
    color:#111;
}

.white{
    background:#fff;
    color:#111;
}

.dark{
    background:#111;
    color:#fff;
}

.hero-show{
    min-height:340px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.hero-phone{
    width:235px;
    height:320px;
    border-radius:28px;
    overflow:hidden;
    border:6px solid #333;
    background:#222;
    transform:rotate(6deg);
    box-shadow:0 30px 70px rgba(0,0,0,.45);
}

.hero-phone img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-hair{
    position:absolute;
    left:2%;
    bottom:5px;
    width:155px;
    height:195px;
    border:5px solid #fff;
    border-radius:18px;
    overflow:hidden;
    transform:rotate(-8deg);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.hero-hair img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   TRUST
========================= */

.trust{
    background:#fff;
    border-bottom:1px solid var(--border);
}

.trust-inner{
    max-width:1250px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.trust-item{
    display:flex;
    align-items:center;
    gap:10px;
}

.trust-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    flex-shrink:0;
}

.trust-item strong{
    display:block;
    font-size:12px;
}

.trust-item small{
    color:#777;
    font-size:10px;
}

/* =========================
   SECTIONS
========================= */

.section{
    max-width:1250px;
    margin:auto;
    padding:60px 20px;
}

.heading{
    margin-bottom:25px;
}

.heading h2{
    font-size:34px;
    letter-spacing:-1px;
}

.heading p{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
