<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PM Traders | Shop Smartphones, Hair, Fashion & Accessories</title>

<meta name="description" content="PM Traders - Shop smartphones, human hair, ladies fashion, gadgets and accessories. Nationwide delivery across South Africa.">
<meta name="keywords" content="PM Traders, smartphones, iPhone, human hair, weaves, fashion, accessories, Richards Bay">
<meta name="theme-color" content="#111111">

<style>
/* =========================================================
   PM TRADERS - PREMIUM ONLINE STORE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f7f7;
    color:#171717;
    line-height:1.5;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

/* =========================================================
   TOP BAR
========================================================= */

.top-bar{
    background:#111;
    color:#fff;
    text-align:center;
    padding:9px 15px;
    font-size:13px;
    letter-spacing:.2px;
}

.top-bar strong{
    color:#f5c542;
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:#fff;
    position:sticky;
    top:0;
    z-index:1000;
    border-bottom:1px solid #eee;
}

.navbar{
    max-width:1250px;
    margin:auto;
    min-height:76px;
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
    font-size:22px;
    letter-spacing:-.5px;
}

.logo-mark{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#111;
    color:#f5c542;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:17px;
}

.logo-text span{
    color:#c49a20;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-links a{
    font-size:14px;
    font-weight:700;
    transition:.2s;
}

.nav-links a:hover{
    color:#c49a20;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid #ddd;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    position:relative;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-3px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:20px;
    background:#d62828;
    color:white;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
}

.mobile-menu{
    display:none;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    background:
        radial-gradient(circle at 85% 20%,rgba(245,197,66,.25),transparent 28%),
        linear-gradient(120deg,#111,#242424);
    color:#fff;
    overflow:hidden;
}

.hero-inner{
    max-width:1250px;
    margin:auto;
    padding:75px 20px;
    min-height:510px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:40px;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;
    background:rgba(255,255,255,.06);
    font-size:13px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(42px,6vw,76px);
    line-height:.98;
    letter-spacing:-3px;
    margin-bottom:22px;
}

.hero h1 span{
    color:#f5c542;
}

.hero p{
    max-width:610px;
    color:#d5d5d5;
    font-size:18px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    border-radius:10px;
    padding:14px 22px;
    font-weight:800;
    transition:.2s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn-primary{
    background:#f5c542;
    color:#111;
}

.btn-primary:hover{
    transform:translateY(-2px);
    background:#ffd75e;
}

.btn-light{
    background:#fff;
    color:#111;
}

.btn-light:hover{
    transform:translateY(-2px);
}

.hero-showcase{
    min-height:340px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.hero-card{
    width:260px;
    height:340px;
    background:linear-gradient(145deg,#303030,#111);
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    transform:rotate(7deg);
    box-shadow:0 30px 80px rgba(0,0,0,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:100px;
}

.hero-card.second{
    position:absolute;
    width:190px;
    height:250px;
    transform:rotate(-12deg) translate(-110px,55px);
    background:linear-gradient(145deg,#f5c542,#d8a91d);
    font-size:70px;
    color:#111;
}

/* =========================================================
   TRUST BAR
========================================================= */

.trust-bar{
    background:#fff;
    border-bottom:1px solid #eee;
}

.trust-inner{
    max-width:1250px;
    margin:auto;
    padding:18px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.trust-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px;
}

.trust-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    background:#fff7d8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.trust-item strong{
    display:block;
    font-size:13px;
}

.trust-item span{
    color:#777;
    font-size:12px;
}

/* =========================================================
   GENERAL SECTIONS
========================================================= */

.section{
    max-width:1250px;
    margin:auto;
    padding:70px 20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:28px;
}

.section-title{
    font-size:34px;
    letter-spacing:-1.3px;
}

.section-subtitle{
    color:#777;
    margin-top:5px;
    font-size:14px;
}

.view-all{
    font-size:14px;
    font-weight:800;
    color:#9b7712;
}

/* =========================================================
   CATEGORIES
========================================================= */

.categories{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:14px;
}

.category{
    background:#fff;
    border:1px solid #eee;
    border-radius:16px;
    padding:24px 10px;
    text-align:center;
    transition:.2s;
    cursor:pointer;
}

.category:hover{
    transform:translateY(-4px);
    border-color:#f0cc57;
    box-shadow:0 12px 30px rgba(0,0,0,.07);
}

.category-icon{
    font-size:34px;
    margin-bottom:10px;
}

.category strong{
    font-size:13px;
}

/* =========================================================
   PROMO
========================================================= */

.promo{
    max-width:1210px;
    margin:0 auto;
    border-radius:22px;
    overflow:hidden;
    background:linear-gradient(110deg,#f5c542,#ffe68a);
    padding:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
}

.promo h2{
    font-size:32px;
    letter-spacing:-1px;
}

.promo p{
    margin-top:5px;
    color:#4e4010;
}

/* =========================================================
   SHOP CONTROLS
========================================================= */

.shop-controls{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.search-box{
    flex:1;
    min-width:220px;
    position:relative;
}

.search-box input{
    width:100%;
    padding:14px 16px 14px 44px;
    border:1px solid #ddd;
    border-radius:11px;
    outline:none;
    background:#fff;
}

.search-box input:focus{
    border-color:#d5ae32;
}

.search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
}

.filter-select{
    padding:14px 15px;
    border:1px solid #ddd;
    border-radius:11px;
    background:#fff;
    min-width:180px;
    outline:none;
}

/* =========================================================
   PRODUCTS
========================================================= */

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:17px;
    overflow:hidden;
    transition:.25s;
    position:relative;
}

.product-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 45px rgba(0,0,0,.09);
}

.product-image{
    height:230px;
    background:linear-gradient(145deg,#f3f3f3,#e7e7e7);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.product-image .emoji{
    font-size:76px;
    transition:.3s;
}

.product-card:hover .product-image .emoji{
    transform:scale(1.08);
}

.product-badge{
    position:absolute;
    left:12px;
    top:12px;
    padding:6px 9px;
    background:#d62828;
    color:white;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
}

.product-info{
    padding:16px;
}

.product-category{
    color:#999;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:800;
}

.product-name{
    font-size:16px;
    margin:5px 0 8px;
    min-height:24px;
}

.rating{
    font-size:12px;
    margin-bottom:10px;
}

.rating span{
    color:#f0b400;
}

.price-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
}

.price{
    font-size:19px;
    font-weight:900;
}

.old-price{
    color:#aaa;
    text-decoration:line-through;
    font-size:13px;
}

.product-actions{
    display:grid;
    grid-template-columns:1fr 43px;
    gap:8px;
}

.add-cart{
    border:none;
    border-radius:9px;
    background:#111;
    color:white;
    font-weight:800;
}

.add-cart:hover{
    background:#2c2c2c;
}

.buy-now{
    border:1px solid #ddd;
    background:white;
    border-radius:9px;
    font-size:18px;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{
    display:none;
    text-align:center;
    padding:50px 20px;
    background:#fff;
    border-radius:15px;
    color:#777;
}

/* =========================================================
   WHY US
========================================================= */

.why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.why-card{
    background:#fff;
    border:1px solid #eee;
    padding:28px;
    border-radius:17px;
}

.why-card-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#fff6d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    margin-bottom:18px;
}

.why-card h3{
    margin-bottom:8px;
}

.why-card p{
    color:#777;
    font-size:14px;
}

/* =========================================================
   REVIEWS
========================================================= */

.reviews{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.review{
    background:#fff;
    border:1px solid #eee;
    padding:25px;
    border-radius:17px;
}

.review-stars{
    color:#f0b400;
    margin-bottom:12px;
}

.review p{
    font-size:14px;
    color:#555;
    margin-bottom:15px;
}

.review strong{
    font-size:13px;
}

/* =========================================================
   NEWSLETTER
========================================================= */

.newsletter{
    background:#111;
    color:#fff;
    border-radius:22px;
    padding:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.newsletter h2{
    font-size:30px;
}

.newsletter p{
    color:#bbb;
    font-size:14px;
    margin-top:5px;
}

.newsletter-form{
    display:flex;
    gap:8px;
    width:430px;
}

.newsletter-form input{
    flex:1;
    border:none;
    padding:14px;
    border-radius:9px;
    outline:none;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    background:#111;
    color:#fff;
    margin-top:20px;
}

.footer-main{
    max-width:1250px;
    margin:auto;
    padding:60px 20px 40px;
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:40px;
}

.footer-brand p{
    color:#aaa;
    font-size:14px;
    margin-top:14px;
    max-width:330px;
}

.footer-col h4{
    margin-bottom:15px;
    color:#f5c542;
}

.footer-col a,
.footer-col p{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:9px;
}

.footer-col a:hover{
    color:#fff;
}

.footer-bottom{
    border-top:1px solid #2b2b2b;
    padding:20px;
    text-align:center;
    color:#888;
    font-size:12px;
}

/* =========================================================
   WHATSAPP
========================================================= */

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25d366;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    z-index:900;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

/* =========================================================
   CART DRAWER
========================================================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}

.cart-drawer{
    position:fixed;
    top:0;
    right:-450px;
    width:min(450px,100%);
    height:100%;
    background:#fff;
    z-index:1600;
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.cart-drawer.active{
    right:0;
}

.cart-header{
    padding:20px;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cart-header h2{
    font-size:21px;
}

.close-cart{
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#f3f3f3;
    font-size:18px;
}

.cart-items{
    flex:1;
    overflow:auto;
    padding:15px 20px;
}

.cart-item{
    display:grid;
    grid-template-columns:58px 1fr auto;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.cart-item-image{
    width:58px;
    height:58px;
    border-radius:10px;
    background:#f3f3f3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.cart-item h4{
    font-size:13px;
}

.cart-item-price{
    font-size:12px;
    color:#777;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
}

.qty-controls button{
    width:25px;
    height:25px;
    border:1px solid #ddd;
    background:white;
    border-radius:5px;
}

.remove-item{
    color:#d62828;
    border:none;
    background:none;
    font-size:11px;
    margin-top:5px;
}

.cart-footer{
    border-top:1px solid #eee;
    padding:20px;
}

.summary-line{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    font-size:14px;
}

.summary-total{
    font-size:20px;
    font-weight:900;
    padding-top:10px;
    margin-top:10px;
    border-top:1px solid #eee;
}

.checkout-btn{
    width:100%;
    border:none;
    background:#25d366;
    color:#fff;
    padding:15px;
    border-radius:10px;
    font-weight:900;
    margin-top:15px;
}

/* =========================================================
   CHECKOUT MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    padding:25px;
    position:relative;
}

.modal-close{
    position:absolute;
    right:18px;
    top:18px;
    border:none;
    background:#f3f3f3;
    width:35px;
    height:35px;
    border-radius:50%;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.delivery-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.delivery-option{
    border:1px solid #ddd;
    border-radius:10px;
    padding:13px;
    cursor:pointer;
}

.delivery-option.active{
    border-color:#d7ae29;
    background:#fff9e7;
}

.delivery-option strong{
    display:block;
    font-size:13px;
}

.delivery-option span{
    color:#777;
    font-size:11px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,120px);
    background:#111;
    color:white;
    padding:13px 20px;
    border-radius:10px;
    z-index:3000;
    opacity:0;
    transition:.3s;
    font-size:13px;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

    .nav-links{
        display:none;
    }

    .mobile-menu{
        display:flex;
    }

    .hero-inner{
        grid-template-columns:1fr;
        text-align:center;
        padding:60px 20px;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .hero-showcase{
        min-height:280px;
    }

    .trust-inner{
        grid-template-columns:repeat(2,1fr);
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .footer-main{
        grid-template-columns:repeat(2,1fr);
    }

    .newsletter{
        flex-direction:column;
        align-items:flex-start;
    }

    .newsletter-form{
        width:100%;
    }
}

@media(max-width:700px){

    .top-bar{
        font-size:11px;
    }

    .navbar{
        min-height:65px;
        padding:10px 14px;
    }

    .logo{
        font-size:18px;
    }

    .logo-mark{
        width:37px;
        height:37px;
        font-size:14px;
    }

    .nav-actions{
        gap:5px;
    }

    .icon-btn{
        width:38px;
        height:38px;
    }

    .hero-inner{
        min-height:auto;
        padding:48px 18px 60px;
    }

    .hero h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .hero p{
        font-size:15px;
    }

    .hero-card{
        width:190px;
        height:250px;
        font-size:70px;
    }

    .hero-card.second{
        width:140px;
        height:190px;
        font-size:50px;
        transform:rotate(-12deg) translate(-90px,40px);
    }

    .trust-inner{
        grid-template-columns:1fr 1fr;
        padding:15px 12px;
    }

    .trust-item{
        gap:7px;
    }

    .trust-item span{
        display:none;
    }

    .section{
        padding:45px 15px;
    }

    .section-title{
        font-size:27px;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
        gap:8px;
