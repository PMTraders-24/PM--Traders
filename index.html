<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="PM Traders - Smartphones, human hair, fashion and accessories.">
<title>PM Traders | Online Store</title>

<style>
*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#111;
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
  cursor:pointer;
}

.topbar{
  background:#111;
  color:#fff;
  padding:9px 15px;
  text-align:center;
  font-size:13px;
}

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.nav{
  max-width:1200px;
  margin:auto;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:12px 18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#e11d48;
}

.navlinks{
  display:flex;
  gap:22px;
  align-items:center;
}

.navlinks a{
  font-weight:700;
  font-size:14px;
}

.cart-btn{
  border:0;
  background:#111;
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  font-weight:800;
}

.hero{
  background:linear-gradient(135deg,#111,#292929);
  color:#fff;
  padding:70px 18px;
}

.hero-inner{
  max-width:1200px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#e11d48;
  padding:7px 12px;
  border-radius:30px;
  font-size:12px;
  font-weight:800;
  margin-bottom:14px;
}

.hero h1{
  font-size:clamp(38px,7vw,70px);
  line-height:.98;
  margin:0 0 20px;
  max-width:750px;
}

.hero p{
  max-width:650px;
  color:#ddd;
  font-size:18px;
  line-height:1.6;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:25px;
}

.btn{
  display:inline-block;
  padding:14px 20px;
  border-radius:10px;
  font-weight:800;
  border:0;
}

.btn-primary{
  background:#fff;
  color:#111;
}

.btn-dark{
  background:#e11d48;
  color:#fff;
}

section{
  max-width:1200px;
  margin:auto;
  padding:55px 18px;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
}

.section-title h2{
  margin:0 0 8px;
  font-size:34px;
}

.section-title p{
  margin:0;
  color:#666;
}

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.category{
  background:#fff;
  border-radius:16px;
  padding:25px 15px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
  font-weight:800;
  transition:.2s;
}

.category:hover{
  transform:translateY(-4px);
}

.category-icon{
  font-size:35px;
  margin-bottom:10px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.product{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  display:flex;
  flex-direction:column;
}

.product-image{
  position:relative;
  width:100%;
  height:290px;
  background:#eee;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.product-image.contain img{
  object-fit:contain;
  background:#fff;
}

.product-info{
  padding:16px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-category{
  font-size:11px;
  text-transform:uppercase;
  color:#777;
  font-weight:800;
  letter-spacing:.5px;
}

.product h3{
  margin:7px 0;
  font-size:17px;
  line-height:1.3;
}

.product-price{
  font-size:20px;
  font-weight:900;
  margin:7px 0 14px;
}

.price-note{
  color:#777;
  font-size:12px;
  font-weight:normal;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:auto;
}

.add-btn,
.order-btn{
  border:0;
  border-radius:9px;
  padding:11px 7px;
  font-weight:800;
}

.add-btn{
  background:#111;
  color:#fff;
}

.order-btn{
  background:#25d366;
  color:#fff;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.info-card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.info-card h3{
  margin-top:0;
}

.info-card p{
  color:#666;
  line-height:1.6;
}

footer{
  background:#111;
  color:#fff;
  padding:45px 18px;
}

.footer-inner{
  max-width:1200
