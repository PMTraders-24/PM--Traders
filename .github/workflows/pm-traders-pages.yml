name: PM Traders - Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pm-traders-pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build PM Traders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PM Traders
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website
        run: |
          test -f index.html
          test -f app.js
          test -f products.js
          test -f style.css
          echo "PM Traders website files validated successfully."

      - name: Upload PM Traders website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy PM Traders
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
